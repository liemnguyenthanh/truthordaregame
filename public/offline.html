<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151d2b"><meta name="robots" content="noindex"><title>Chơi offline · Thật hay Thách</title><style>body{background:#151d2b;color:#f7f8fc;font:16px/1.7 system-ui,sans-serif;margin:0}.offline-screen{max-width:540px;margin:60px auto;padding:24px}h1{font-size:32px;line-height:1.3}p,small{color:#a8b3c7}a{display:block;padding:16px;border:1px solid #ffffff25;border-radius:12px;margin:12px 0;color:#e1b4ff;text-decoration:none}button{background:#9636d4;border:0;border-radius:10px;color:white;padding:12px 18px;font:inherit}</style></head><body><main class="offline-screen"><p>THẬT. THÁCH</p><h1>Không có mạng?<br>Cuộc vui vẫn tiếp tục.</h1><p>Chọn một bộ bạn đã lưu trên thiết bị này.</p><div id="packs"></div><small id="note"></small><p><button onclick="location.href='/vi'">Thử kết nối lại</button></p></main><script>try{const packs=JSON.parse(localStorage.getItem('tod:offline:v1')||'[]');for(const pack of packs){const a=document.createElement('a');a.textContent=pack.title;a.href='/vi/choi/'+encodeURIComponent(pack.slug);document.getElementById('packs').appendChild(a)}const generated=JSON.parse(localStorage.getItem('tod:generated-history:v1')||'[]').filter(p=>p.status==='complete'&&localStorage.getItem('tod:generated:v1:'+p.id));for(const pack of generated){const a=document.createElement('a');a.textContent=pack.pack?.title||'Bộ AI của nhóm';a.href='/vi/bo-ai?id='+encodeURIComponent(pack.id);document.getElementById('packs').appendChild(a)}if(!packs.length&&!generated.length)document.getElementById('note').textContent='Bạn chưa lưu bộ nào. Khi có mạng, mở một bộ và chọn “Lưu bộ để chơi offline”.'}catch{document.getElementById('note').textContent='Chưa có bộ được lưu trên thiết bị.'}</script></body></html>
